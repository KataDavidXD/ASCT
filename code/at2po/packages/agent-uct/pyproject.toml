[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-uct"
version = "0.1.0"
description = "Uniform, UCT, and AgentUCT with a QID-scoped WTB prefix cache"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "langgraph>=1.1,<2",
  "wtb[langgraph-sqlite]==0.3.1",
]

[tool.setuptools.packages.find]
include = ["uct_engine", "uct_engine.*"]
