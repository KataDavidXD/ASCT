[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asct-at2po"
version = "0.1.0"
description = "ASCT paper implementation: at2po"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "agent-uct",
  "FlagEmbedding>=1.4,<2",
  "peft>=0.20,<0.21",
  "pyarrow>=25,<26",
  "sentence-transformers>=5.7,<6",
  "torch>=2.12,<2.13",
  "transformers>=5.14,<5.15",
]

[project.scripts]
asct-train = "atppo_lab.main:main"
tiny_debug_parallel_resume = "atppo_lab.tiny_debug_parallel_resume:main"

[tool.uv.sources]
agent-uct = { path = "packages/agent-uct", editable = true }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["atppo_lab*"]
